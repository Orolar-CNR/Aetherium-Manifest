name: Deploy Aetherium Light Manifest

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate files and contract
        run: |
          echo "Verifying presence of essential assets and contract..."
          [ -f index.html ] || { echo "index.html is missing!"; exit 1; }
          [ -f styles.css ] || { echo "styles.css is missing!"; exit 1; }
          [ -f app.js ] || { echo "app.js is missing!"; exit 1; }
          [ -f package.json ] || { echo "package.json is missing!"; exit 1; }
          [ -f runtime/visual-state.js ] || { echo "runtime/visual-state.js is missing!"; exit 1; }
          [ -f contracts/visual-state.schema.json ] || { echo "contracts/visual-state.schema.json is missing!"; exit 1; }
          [ -f tests/visual-state.test.js ] || { echo "tests/visual-state.test.js is missing!"; exit 1; }
          echo "Validating Canvas setup in index.html..."
          grep -q "<canvas id=\"manifestCanvas\"></canvas>" index.html || { echo "Canvas element missing from index.html!"; exit 1; }
          echo "Validation completed successfully."

      - name: Run Tests
        run: |
          echo "Executing contract tests..."
          node tests/visual-state.test.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
