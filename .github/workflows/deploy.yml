name: Deploy Aetherium Light Manifest

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  deploy:

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate files and contract
        run: |
          echo "Verifying presence of essential assets and contract..."
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f package.json
          test -f runtime/visual-state.js
          test -f runtime/reference-renderer.js
          test -f docs/testing/AETHERIUM-REFERENCE-RENDERER-CONFORMANCE.md
          test -f contracts/visual-state.schema.json
          test -f tests/visual-state.test.js
          for f in idle listening processing responding warning error nirodha; do
            test -f "tests/fixtures/visual-states/${f}.json"
          done
          echo "Validating Canvas setup in index.html..."
          grep -q "<canvas id=\"manifestCanvas\"></canvas>" index.html
          echo "Validation completed successfully."

      - name: Run Tests
        run: |
          echo "Executing contract tests..."
          node tests/visual-state.test.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
