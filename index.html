<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="description"
    content="Aetherium Light Manifest — perceptual interface rendered as light and particle formation."
  />

  <meta name="theme-color" content="#020204" />

  <title>Aetherium Light Manifest</title>

  <link rel="stylesheet" href="./styles.css" />
</head>

<body>

  <main id="app" aria-label="Aetherium Light Manifest">

    <canvas id="manifestCanvas"></canvas>

    <!--
      Input surface only.
      The system does not render textual answers.
      The result appears on the canvas as light / particle formation.
    -->
    <section class="interaction-field" aria-label="Intent input">

      <form id="intentForm" autocomplete="off">

        <div class="input-shell">

          <input
            id="intentInput"
            type="text"
            maxlength="280"
            autocomplete="off"
            spellcheck="false"
            placeholder="ส่งเจตจำนง..."
            aria-label="ส่งเจตจำนง"
          />

          <button
            id="resonanceButton"
            type="submit"
            aria-label="ส่งเจตจำนง"
            title="ส่งเจตจำนง"
          >
            <span class="button-core"></span>
          </button>

        </div>

      </form>

    </section>

  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
